# One global, scenario-independent SOFT-VoFOD V3 configuration. V3-specific
# values are calibrated only on CAL06-CAL09; test scenes never select them.
world_frame_id: world
micro_batch_dt_s: 0.01

input:
  points_world_topic: /uav1/mid360/points_world
  rays_checked_topic: /uav1/mid360/rays_checked
  sync_queue_size: 32
  expected_rays_per_bundle: 0
  geometry_consistency_tolerance_m: 0.01

map:
  center: {x: 10.0, y: 0.0, z: 5.0}
  dimensions: {x: 40.0, y: 30.0, z: 16.0}
  voxel_size_m: 0.5
  evidence_scale: 5.0
  confidence_threshold: 0.6
  free_probability_threshold: 0.7
  background_probability_threshold: 0.7
  background_promotion_groups: 3
  background_promotion_duration_s: 1.0
  map_epoch_hz: 5.0
  free_saturation_n0: 1.0
  free_epoch_weight: 1.0
  # CAL06-CAL08 provisional center candidates; frozen before test replay.
  certified_free_min_epochs: 3
  certified_free_min_duration_s: 0.4
  certified_free_min_valid_epochs: 1
  surface_uncertainty_margin_m: 0.75
  require_certified_free_for_events: true
  background_attach_distance_m: 0.8
  background_separate_distance_m: 1.0
  free_packet_ratio: 0.5
  track_explained_ratio: 0.25
  background_supported_weight: 5.0
  unknown_promotion_epochs: 3
  unknown_promotion_time_s: 1.0
  unknown_position_sigma_m: 0.15
  unknown_match_distance_m: 1.0
  unknown_candidate_timeout_s: 1.0
  valid_free_weight: 1.0
  no_return_free_weight: 0.5
  background_weight: 1.0
  endpoint_guard_m: 0.5
  target_guard_m: 0.2
  max_no_return_free_range_m: 20.0

event:
  free_probability_threshold: 0.7
  background_exclusion_m: 0.75
  background_search_m: 2.0
  distance_scale_m: 1.0
  packet_dt_s: 0.03
  packet_radius_m: 0.75
  packet_sensor_variance_m2: 0.1
  packet_shape_sigma_m: 0.35
  packet_sampling_variance_floor_m2: 0.04

birth:
  buffer_duration_s: 2.0
  max_buffer_events: 256
  event_group_dt_s: 0.05
  min_groups: 5
  min_duration_s: 0.1
  pair_dt_min_s: 0.02
  pair_dt_max_s: 2.0
  max_speed_mps: 15.0
  max_residual_m: 0.8
  inlier_gate_d2: 11.345
  min_total_anomaly_score: 1.5
  suppression_radius_m: 1.0
  birth_spatial_cell_m: 1.0
  max_births_per_spatial_cell_per_epoch: 1
  # 3-D chi-square 99.9% gate: UNKNOWN needs stronger evidence than a
  # background surface footprint drifting with exploration.
  unknown_motion_gate_d2: 16.266
  sequential_unknown_min_groups: 3
  sequential_target_log_odds: 6.0
  sequential_background_log_odds: 6.0
  sequential_max_unresolved_s: 5.0
  # Pre-track dynamics are deliberately narrower than the maneuvering IMM:
  # this likelihood compares constant-world-point against ordinary CV motion.
  sequential_acceleration_sigma_mps2: 1.0
  sequential_initial_velocity_variance_m2ps2: 1.0

tracker:
  acceleration_sigma_mps2: 3.0
  measurement_variance_m2: 0.1
  shape_sigma_m: 0.35
  initial_velocity_variance_m2ps2: 9.0
  association_gate_d2: 11.345
  anomaly_cost_weight: 0.1
  target_radius_m: 0.75
  map_support_sigma: 2.0
  map_support_uncertainty_cap_m: 1.5
  birth_existence: 0.6
  confirm_threshold: 0.8
  delete_threshold: 0.1
  clutter_density: 0.001
  # CAL09 candidate, evaluated together with dormant/reportability.
  survival_lambda_per_s: 0.1
  tentative_max_age_s: 1.0
  # Allow two 5 Hz map epochs plus phase jitter for the first maintenance hit.
  tentative_max_no_measurement_s: 0.5
  confirmed_max_no_measurement_s: 6.0
  duplicate_merge_position_d2: 1.0
  duplicate_merge_distance_m: 0.25
  duplicate_merge_velocity_mps: 0.5
  duplicate_merge_measurement_dt_s: 0.05
  duplicate_merge_birth_dt_s: 0.5
  hard_timeout_s: 30.0
  quarantine_duration_s: 2.0
  ca_jerk_sigma_mps3: 3.0
  imm_initial_acceleration_variance_m2ps4: 9.0
  imm_cv_to_ca_probability: 0.05
  imm_ca_to_cv_probability: 0.1
  occlusion_enter_score: 0.6
  occluded_to_dormant_s: 1.0
  dormant_timeout_s: 10.0
  dormant_reacquisition_gate_d2: 16.266
  reacquisition_max_speed_mps: 15.0
  reacquisition_max_acceleration_mps2: 6.0
  reactivation_confirm_s: 1.0
  reportability_time_constant_s: 1.0
  reportability_uncertainty_scale_m: 1.5
  reportability_threshold: 0.2

opportunity:
  return_probability: 0.5
  # CAL04 range-only fallback; real angular calibration remains unavailable.
  return_probability_range_edges_m: [10.0, 20.0, 30.0]
  return_probability_bins: [0.916, 0.878, 0.877, 0.5]
  detection_probability_cap: 0.95
  max_ray_range_m: 60.0
  occlusion_margin_m: 0.15
  sigma_point_scale: 1.0
  # V4 effective-cell candidates selected on CAL10-CAL14.  Strict R5 kept
  # their probabilities diagnostics-only because HOTA fell in 10/10 pairs.
  angular_cell_chord: 0.05
  geometry_sigma_scale: 1.0
  target_fill_factor: 0.35
  illumination_rate_per_cell: 1.0

ablation:
  opportunity_aware_existence: false
  target_feedback: true
  hungarian_association: true
  track_conditioned_packet_split: true
  cv_ca_imm: true
  survival_prediction: true
  reportability_filtering: true
  dormant_reacquisition: true
  # R0/R1 S05 gate: explicit PRE was safe but added 0.20 s report latency and
  # did not improve HOTA/FN, so it remains an evaluated development path.
  two_stage_dormant_reactivation: false
  epistemic_unknown_birth: true
  sequential_unknown_inference: true
  effective_opportunity_cells: true
  range_conditioned_opportunity_return: true

safety:
  max_time_jump_s: 1.0

initialization:
  # Protocol-derived: source bags provide strictly more than 10 s without a
  # target; use it to assimilate previously unknown static surfaces before
  # target birth is enabled.
  warmup_duration_s: 10.0

output:
  map_every_n_scans: 5
