# S01: two collision-free UAVs traverse the same airway intersection at
# different times and at vertically separated flight levels.  They never stop,
# reverse, or deliberately fly side by side.  Around the closest approach
# their visible surfaces are nevertheless
# within the shared 1.25 m Euclidean-component tolerance. This stresses the
# behavior of a component-based detector at a close, collision-free crossing.
schema_version: 1
scenario: S01_time_separated_airway_crossing
world_frame: world
seed: 404
repeat_count: 1
repeat_mode: restart
start_delay: 5.0
duration: 32.0
final_hold: 3.0

runtime:
  set_model_state_service: /gazebo/set_model_state
  world_properties_service: /gazebo/get_world_properties
  event_topic: /mid360_multi_uav_sim/scenario_events
  publish_rate: 50.0
  service_timeout_wall: 30.0
  clock_timeout_wall: 30.0
  max_clock_stall_wall: 20.0
  max_consecutive_service_failures: 3
  require_use_sim_time: true

randomization:
  position_offset_uniform: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

# Snapshot geometry is explicit: offset_time_ns is not used to replay target
# motion inside one scan.  The merge opportunity is therefore geometric, not
# an artefact attributed to unimplemented rolling-scan motion distortion.
crossing_contract:
  geometry_mode: snapshot
  crossing_point_xy: {x: 8.0, y: 0.0}
  eastbound_flight_level_m: 2.25
  northbound_flight_level_m: 3.25
  speed_mps: 0.3
  eastbound_crossing_time_sec: 12.0
  northbound_crossing_time_sec: 13.0
  crossing_time_separation_sec: 1.0
  minimum_center_separation_m: 1.0222524150130436
  target_vertical_collision_half_extent_m: 0.09
  minimum_vertical_collision_clearance_m: 0.82
  euclidean_cluster_tolerance_m: 1.25

targets:
  uav1:
    model_name: uav1
    command_model: false
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav1/odom
    child_frame_id: uav1/fcu
    initial_pose: {x: 0.0, y: 0.0, z: 2.0, yaw: 0.0}
  uav2:
    model_name: uav2
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav2/odom
    child_frame_id: uav2/base_link
    initial_pose: {x: 4.4, y: 0.0, z: 2.25, yaw: 0.0}
  uav3:
    model_name: uav3
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav3/odom
    child_frame_id: uav3/base_link
    initial_pose: {x: 8.0, y: -3.9, z: 3.25, yaw: 1.5707963267948966}

phases:
  - id: track_establishment_hold
    duration: 3.0
    interpolation: hold

  - id: continuous_crossing_transit
    event: crossing_transit_start
    duration: 26.0
    interpolation: linear
    targets:
      uav2: {x: 12.2, y: 0.0, z: 2.25, yaw: 0.0}
      uav3: {x: 8.0, y: 3.9, z: 3.25, yaw: 1.5707963267948966}

  - id: post_crossing_hold
    event: crossing_transit_end
    duration: 3.0
    interpolation: hold
