# S06: the observer first discovers the E2 background wall into an initially
# empty online map, then enters a scored wall-occlusion interval.  No a-priori
# map loader is permitted by this schema-v6 authority contract.
schema_version: 6
scenario_profile: s06
semantic_contract_id: mid360-multi-uav-s06-online-map-occlusion-v1
scenario: S06_incomplete_map_online_occlusion
world_frame: world
seed: 909
repeat_count: 1
repeat_mode: restart
start_delay: 5.0
duration: 22.0
final_hold: 3.0

runtime:
  set_model_state_service: /gazebo/set_model_state
  world_properties_service: /gazebo/get_world_properties
  event_topic: /mid360_multi_uav_sim/scenario_events
  publish_rate: 50.0
  service_timeout_wall: 30.0
  clock_timeout_wall: 30.0
  max_clock_stall_wall: 20.0
  max_consecutive_service_failures: 3
  require_use_sim_time: true

randomization:
  position_offset_uniform:
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0

observer_motion:
  observer: uav1
  parent_frame: world
  child_frame: uav1/fcu
  tf_authority: scenario_manager
  unique_dynamic_tf_authority: true
  minimum_translation_m: 2.0
  minimum_yaw_change_rad: 0.35
  scored_phase: online_occlusion_scored
  stationary_targets: [uav2, uav3, uav4]

online_map_contract:
  initial_state: empty_online_scores_no_apriori_loader
  apriori_loader_used: false
  initial_map_revision: 0
  bootstrap_phase: map_bootstrap_clear_hold
  discovery_primitive: background_wall/wall_collision
  scored_map_occluded_target: uav4
  transition: initial_unknown_to_committed_sure_occupied

targets:
  uav1:
    model_name: uav1
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav1/odom
    child_frame_id: uav1/fcu
    initial_pose: {x: 4.0, y: -3.0, z: 2.0, yaw: -0.7853981633974483}
  uav2:
    model_name: uav2
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav2/odom
    child_frame_id: uav2/base_link
    initial_pose: {x: 8.0, y: 1.8461538461538463, z: 2.25, yaw: 0.0}
  uav3:
    model_name: uav3
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav3/odom
    child_frame_id: uav3/base_link
    initial_pose: {x: 13.0, y: 3.0, z: 2.25, yaw: 0.0}
  uav4:
    model_name: uav4
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav4/odom
    child_frame_id: uav4/base_link
    initial_pose: {x: 14.0, y: 0.0, z: 2.25, yaw: 0.0}

phases:
  - id: map_bootstrap_clear_hold
    duration: 4.0
    interpolation: hold

  - id: approach_online_occlusion
    event: map_bootstrap_end
    duration: 4.0
    interpolation: linear
    targets:
      uav1: {x: 0.0, y: 0.0, z: 2.0, yaw: 0.0}

  - id: online_occlusion_scored
    event: online_occlusion_start
    duration: 6.0
    interpolation: linear
    targets:
      uav1: {x: -2.0, y: -0.46153846153846156, z: 2.0, yaw: 0.4}

  - id: leave_online_occlusion
    event: online_occlusion_end
    duration: 5.0
    interpolation: linear
    targets:
      uav1: {x: 4.0, y: -3.0, z: 2.0, yaw: 0.7853981633974483}

  - id: final_clear_hold
    event: final_clear_start
    duration: 3.0
    interpolation: hold
