# S03: fixed-yaw observer translation against two stationary targets and a
# sparse static background.  Schema v2 is intentionally exclusive to this
# moving-observer contract; schema-v1 S01/S02 semantics remain unchanged.
schema_version: 2
scenario_profile: s03
semantic_contract_id: mid360-multi-uav-s03-observer-motion-v1
scenario: S03_moving_observer_translation
world_frame: world
seed: 606
repeat_count: 1
repeat_mode: restart
start_delay: 5.0
duration: 14.0
final_hold: 3.0

runtime:
  set_model_state_service: /gazebo/set_model_state
  world_properties_service: /gazebo/get_world_properties
  event_topic: /mid360_multi_uav_sim/scenario_events
  publish_rate: 50.0
  service_timeout_wall: 30.0
  clock_timeout_wall: 30.0
  max_clock_stall_wall: 20.0
  max_consecutive_service_failures: 3
  require_use_sim_time: true

randomization:
  position_offset_uniform:
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0

observer_motion:
  observer: uav1
  parent_frame: world
  child_frame: uav1/fcu
  tf_authority: scenario_manager
  unique_dynamic_tf_authority: true
  fixed_yaw: 0.0
  minimum_translation_m: 3.5
  scored_phase: observer_translation_scored
  stationary_targets: [uav2, uav3]

targets:
  uav1:
    model_name: uav1
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav1/odom
    child_frame_id: uav1/fcu
    initial_pose: {x: 0.0, y: 0.0, z: 2.0, yaw: 0.0}
  uav2:
    model_name: uav2
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav2/odom
    child_frame_id: uav2/base_link
    initial_pose: {x: 10.0, y: -2.0, z: 2.25, yaw: 0.0}
  uav3:
    model_name: uav3
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav3/odom
    child_frame_id: uav3/base_link
    initial_pose: {x: 15.0, y: 2.0, z: 2.25, yaw: 0.0}

phases:
  - id: initial_hold
    duration: 3.0
    interpolation: hold

  # The full scored window is a constant 0.5 m/s world-X translation.  Both
  # targets remain at their initial poses, so scan-time differences come from
  # observer motion rather than target motion.
  - id: observer_translation_scored
    event: observer_motion_scored_start
    duration: 8.0
    interpolation: linear
    targets:
      uav1: {x: 4.0, y: 0.0, z: 2.0, yaw: 0.0}

  - id: post_motion_hold
    event: observer_motion_scored_end
    duration: 3.0
    interpolation: hold
