# S05: one moving/yawing observer traverses a dense primitive scene while
# five stationary target UAVs provide a bounded clutter stress fixture.
schema_version: 5
scenario_profile: s05
semantic_contract_id: mid360-multi-uav-s05-cluttered-stress-v1
scenario: S05_cluttered_five_target_stress
world_frame: world
seed: 808
repeat_count: 1
repeat_mode: restart
start_delay: 5.0
duration: 24.0
final_hold: 3.0

runtime:
  set_model_state_service: /gazebo/set_model_state
  world_properties_service: /gazebo/get_world_properties
  event_topic: /mid360_multi_uav_sim/scenario_events
  publish_rate: 50.0
  service_timeout_wall: 30.0
  clock_timeout_wall: 30.0
  max_clock_stall_wall: 20.0
  max_consecutive_service_failures: 3
  require_use_sim_time: true

randomization:
  position_offset_uniform:
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0

observer_motion:
  observer: uav1
  parent_frame: world
  child_frame: uav1/fcu
  tf_authority: scenario_manager
  unique_dynamic_tf_authority: true
  minimum_translation_m: 5.0
  minimum_yaw_change_rad: 0.7
  scored_phase: peak_stress_scored
  stationary_targets: [uav2, uav3, uav4, uav5, uav6]

targets:
  uav1:
    model_name: uav1
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav1/odom
    child_frame_id: uav1/fcu
    initial_pose: {x: -4.0, y: -5.0, z: 2.0, yaw: -0.35}
  uav2:
    model_name: uav2
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav2/odom
    child_frame_id: uav2/base_link
    initial_pose: {x: 7.0, y: -4.0, z: 2.25, yaw: 0.0}
  uav3:
    model_name: uav3
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav3/odom
    child_frame_id: uav3/base_link
    initial_pose: {x: 10.0, y: -1.0, z: 2.25, yaw: 0.0}
  uav4:
    model_name: uav4
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav4/odom
    child_frame_id: uav4/base_link
    initial_pose: {x: 12.0, y: 3.0, z: 2.25, yaw: 0.0}
  uav5:
    model_name: uav5
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav5/odom
    child_frame_id: uav5/base_link
    initial_pose: {x: 7.0, y: 5.0, z: 2.25, yaw: 0.0}
  uav6:
    model_name: uav6
    command_model: true
    truth_topic: /mid360_multi_uav_sim/ground_truth/uav6/odom
    child_frame_id: uav6/base_link
    initial_pose: {x: 15.0, y: 0.8, z: 2.25, yaw: 0.0}

phases:
  - id: initial_stress_hold
    duration: 4.0
    interpolation: hold

  - id: enter_clutter
    event: initial_stress_end
    duration: 5.0
    interpolation: linear
    targets:
      uav1: {x: -1.0, y: -2.0, z: 2.0, yaw: 0.0}

  - id: peak_stress_scored
    event: stress_window_start
    duration: 8.0
    interpolation: linear
    targets:
      uav1: {x: 3.0, y: 2.0, z: 2.0, yaw: 0.75}

  - id: exit_clutter
    event: stress_window_end
    duration: 5.0
    interpolation: linear
    targets:
      uav1: {x: 5.0, y: -3.0, z: 2.0, yaw: -0.4}

  - id: final_stress_hold
    event: final_stress_start
    duration: 2.0
    interpolation: hold
