#!/usr/bin/env python
PACKAGE = "lidar_tracker_mid360"

from dynamic_reconfigure.parameter_generator_catkin import *
gen = ParameterGenerator()

gen.add("lkf__Q__position", double_t, 0, "Per-update position variance", 0.0001, 0, 1.0)
gen.add("lkf__Q__velocity", double_t, 0, "Per-update velocity variance", 0.04, 0, 10.0)
gen.add("lkf__Q__acceleration", double_t, 0, "Per-update acceleration variance", 0.09, 0, 10.0)

gen.add("lkf__R__coeff", double_t, 0, "Position measurement variance", 0.09, 0, 10.0)

gen.add("lkf__P__init__position", double_t, 0, "Initial position variance", 0.09, 0, 10.0)
gen.add("lkf__P__init__velocity", double_t, 0, "Initial velocity variance", 1.0, 0, 10.0)
gen.add("lkf__P__init__acceleration", double_t, 0, "Initial acceleration variance", 1.0, 0, 10.0)

exit(gen.generate(PACKAGE, "LidarTracker", "covmat"))
