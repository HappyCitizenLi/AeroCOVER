# Faithful VoFOD detector settings for the Mid-360 interface.
sync_queue_size: 32
expected_rays_per_bundle: 20000
require_expected_ray_count: true

operation_area:
  center:
    # Common benchmark operating volume. The detector range is independently
    # capped at the Mid-360 evaluation limit below.
    x: 11.0
    y: 7.0
    z: 5.0
  size:
    x: 62.0
    y: 38.0
    z: 16.0

voxel_map:
  voxel_size: 0.5
  scores:
    init: -740.0
    point: 0.0
    unknown: -740.0
    ray: -1000.0
  thresholds:
    apriori_map: 0.0
    # Upstream VoFOD threshold for a confirmed/sure background voxel.
    sure_obstacles: -0.1
    new_obstacles: -300.0
    frontiers: -750.0

clustering:
  # Upstream VoFOD detection_params.yaml uses ground_points_max_distance=1.5 m
  # as the PCL Euclidean cluster tolerance.
  tolerance: 1.50
  min_points: 2
  max_size: 3.0
  max_distance: 50.0
  background_distance: 1.5
  max_explore_distance: 3.0

background:
  mode: native_rangefinder
  # Original VoFOD map-maturity gate: fraction of XY map cells.
  sufficient_points_ratio: 0.15

# Upstream VoFOD Section III-D / detection_params.yaml.
separate_background:
  period_s: 0.1
  max_distance: 0.8
  min_sure_voxels: 24

input:
  geometry_consistency_tolerance_m: 0.01

output:
  position_sigma: 0.1
  base_detection_probability: 0.5
  visualization_every_n_scans: 5
  publish_free_voxels: true

profiling:
  warn_total_ms: 100.0
